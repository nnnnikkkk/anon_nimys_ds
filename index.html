<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ACCESS://DISCORD</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=VT323&display=swap');

  :root{
    --bg: #050705;
    --bg2: #0a0f0a;
    --green: #00ff66;
    --green-dim: #0a8f3f;
    --green-dark: #052c14;
    --red: #ff2b2b;
    --white: #d9ffe4;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    background: var(--bg);
    color: var(--green);
    font-family: 'Share Tech Mono', monospace;
    overflow-x: hidden;
    min-height: 100vh;
  }

  canvas#matrix{
    position: fixed;
    top:0; left:0;
    width: 100%; height: 100%;
    z-index: 0;
    opacity: 0.35;
  }

  .scanlines{
    pointer-events:none;
    position: fixed; inset:0;
    z-index: 5;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.15) 3px
    );
    mix-blend-mode: overlay;
  }

  .vignette{
    pointer-events:none;
    position: fixed; inset:0;
    z-index: 4;
    box-shadow: inset 0 0 180px 40px rgba(0,0,0,0.9);
  }

  .wrap{
    position: relative;
    z-index: 10;
    max-width: 760px;
    margin: 0 auto;
    padding: 60px 20px 100px;
    display:flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .tag{
    font-size: 12px;
    letter-spacing: 4px;
    color: var(--green-dim);
    border: 1px solid var(--green-dark);
    padding: 6px 14px;
    border-radius: 2px;
    margin-bottom: 28px;
    animation: blink 2.4s infinite;
  }

  @keyframes blink{
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }

  h1{
    font-family: 'VT323', monospace;
    font-size: clamp(48px, 11vw, 96px);
    line-height: 0.95;
    letter-spacing: 2px;
    color: var(--white);
    text-shadow:
      0 0 6px var(--green),
      0 0 18px rgba(0,255,102,0.6),
      0 0 40px rgba(0,255,102,0.25);
    position: relative;
  }

  h1 span.glitch{
    position: relative;
    display: inline-block;
  }

  h1 span.glitch::before,
  h1 span.glitch::after{
    content: attr(data-text);
    position: absolute;
    left: 0; top: 0;
    width: 100%;
    overflow: hidden;
    background: var(--bg);
    clip-path: inset(0 0 0 0);
  }

  h1 span.glitch::before{
    color: var(--red);
    animation: glitchTop 3.5s infinite linear;
  }

  h1 span.glitch::after{
    color: #00e0ff;
    animation: glitchBottom 3.5s infinite linear;
  }

  @keyframes glitchTop{
    0%, 92%, 100% { clip-path: inset(0 0 100% 0); transform: translate(0,0); }
    93% { clip-path: inset(10% 0 60% 0); transform: translate(-3px,-1px); }
    95% { clip-path: inset(40% 0 20% 0); transform: translate(3px,1px); }
    97% { clip-path: inset(70% 0 5% 0); transform: translate(-2px,0); }
  }
  @keyframes glitchBottom{
    0%, 91%, 100% { clip-path: inset(100% 0 0 0); transform: translate(0,0); }
    92% { clip-path: inset(55% 0 15% 0); transform: translate(3px,1px); }
    94% { clip-path: inset(20% 0 55% 0); transform: translate(-3px,-1px); }
    96% { clip-path: inset(5% 0 80% 0); transform: translate(2px,0); }
  }

  .sub{
    margin-top: 22px;
    font-size: 15px;
    color: var(--green-dim);
    letter-spacing: 1px;
    max-width: 480px;
  }
  .sub b{ color: var(--green); font-weight: normal; }

  .terminal{
    margin-top: 44px;
    width: 100%;
    max-width: 560px;
    background: rgba(5, 15, 8, 0.75);
    border: 1px solid var(--green-dark);
    border-radius: 6px;
    text-align: left;
    box-shadow: 0 0 40px rgba(0,255,102,0.08);
    backdrop-filter: blur(2px);
  }

  .terminal-bar{
    display:flex;
    align-items:center;
    gap: 8px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--green-dark);
  }
  .dot{ width:10px; height:10px; border-radius:50%; background: var(--green-dark); }
  .terminal-bar span.title{
    margin-left: 10px;
    font-size: 12px;
    color: var(--green-dim);
    letter-spacing: 1px;
  }

  .terminal-body{
    padding: 18px 16px 22px;
    font-size: 14px;
    line-height: 1.7;
    min-height: 170px;
  }

  .terminal-body .line{ white-space: pre-wrap; word-break: break-word; }
  .terminal-body .ok{ color: var(--green); }
  .terminal-body .dim{ color: var(--green-dim); }
  .terminal-body .cursor{
    display:inline-block;
    width: 8px; height: 15px;
    background: var(--green);
    vertical-align: text-bottom;
    animation: blink 1s steps(1) infinite;
  }

  .cta{
    margin-top: 38px;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 16px 36px;
    font-family: 'Share Tech Mono', monospace;
    font-size: 16px;
    letter-spacing: 3px;
    text-decoration: none;
    color: var(--bg);
    background: var(--green);
    border-radius: 3px;
    text-transform: uppercase;
    box-shadow: 0 0 25px rgba(0,255,102,0.5);
    opacity: 0;
    transform: translateY(10px);
    transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
    pointer-events: none;
  }
  .cta.show{
    opacity: 1;
    pointer-events: auto;
    animation: fadeUp .6s ease forwards;
  }
  @keyframes fadeUp{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }
  .cta:hover{
    background: var(--white);
    box-shadow: 0 0 40px rgba(0,255,102,0.9);
    transform: translateY(-2px);
  }

  .footer{
    margin-top: 50px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--green-dark);
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  #dvd{
    position: fixed;
    top: 0; left: 0;
    width: 90px;
    height: 107px;
    z-index: 3;
    pointer-events: none;
    color: var(--green);
    will-change: transform;
  }
  #dvd img{
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
    filter: drop-shadow(0 0 12px currentColor) drop-shadow(0 0 4px currentColor);
  }
</style>
</head>

  cursorLine.className = 'line';
  cursorLine.innerHTML = '<span class="cursor"></span>';
  body.appendChild(cursorLine);
  btn.classList.add('show');
}
run();

// ---------- DVD-style bouncing Anonymous mask ----------
const dvd = document.getElementById('dvd');
const colors = ['#00ff66', '#ff2b2b', '#00e0ff', '#ffbd2e', '#d900ff', '#ffffff'];
let dvdW = dvd.offsetWidth, dvdH = dvd.offsetHeight;
let x = Math.random() * (window.innerWidth - dvdW);
let y = Math.random() * (window.innerHeight - dvdH);
let vx = 2.2, vy = 1.8;
let colorIdx = 0;
dvd.style.color = colors[colorIdx];

function onResize2(){
  dvdW = dvd.offsetWidth; dvdH = dvd.offsetHeight;
}
window.addEventListener('resize', onResize2);

function bounceColor(){
  colorIdx = (colorIdx + 1) % colors.length;
  dvd.style.color = colors[colorIdx];
}

function tick(){
  x += vx; y += vy;

  if(x <= 0){ x = 0; vx = Math.abs(vx); bounceColor(); }
  if(x + dvdW >= window.innerWidth){ x = window.innerWidth - dvdW; vx = -Math.abs(vx); bounceColor(); }
  if(y <= 0){ y = 0; vy = Math.abs(vy); bounceColor(); }
  if(y + dvdH >= window.innerHeight){ y = window.innerHeight - dvdH; vy = -Math.abs(vy); bounceColor(); }

  dvd.style.transform = `translate(${x}px, ${y}px)`;
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
